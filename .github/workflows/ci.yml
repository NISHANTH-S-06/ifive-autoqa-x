name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: Core tests (browser/Windows/script tests run in the e2e job or locally)
        run: >
          python -m pytest -q -p no:cacheprovider -W ignore
          --ignore=tests/test_playwright_execution.py
          --ignore=tests/test_stage14_release.py
          --ignore=tests/test_phase9_autonomous_platform.py
          --ignore=tests/test_stage10_automated_execution.py
          --ignore=tests/test_stage11_acceptance.py
          --ignore=tests/test_demo_script_safety.py
  sample-apps:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [mock-task-portal/backend, demo-product/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r ${{ matrix.app }}/requirements.txt pytest
      - run: python -m pytest -q -p no:cacheprovider
        working-directory: ${{ matrix.app }}
  e2e-playwright:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: browser tests need a full browser setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: qa
      - run: pip install -r backend/requirements.txt pytest
      - run: >
          python -m pytest -q -p no:cacheprovider -W ignore
          tests/test_playwright_execution.py
          tests/test_phase9_autonomous_platform.py
          tests/test_stage10_automated_execution.py
          tests/test_stage11_acceptance.py
        working-directory: backend
